# Crewzy marketing site — crewzy.io
#
# DNS stays at the existing registrar: add a CNAME for `www` -> <site>.netlify.app
# and an ALIAS/A record on the apex. No nameserver change, so existing email
# authentication records are untouched.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Shared destination for "Start free" and "Sign in".
  # The production application is provisioned and released separately.
  NEXT_PUBLIC_APP_ORIGIN = "https://app.crewzy.io"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Next proxy.ts is compiled by the adapter into an edge function. It chooses
# pre-rendered pricing market paths using trusted Netlify country context.
# The application independently enforces the company's billing country.
